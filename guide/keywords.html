<p>모든 페이지의 태그와 본문을 한곳에서 찾는다</p>
<div class="sitenav"></div>

<section id="kw-find">
<h2>키워드 검색</h2>
<p>제목, 태그, 본문에서 찾는다. 단어를 띄우면 모두 들어간 항목만 남고, <code>#태그</code>로 쓰면 그 태그가 붙은 항목만 보인다.</p>
<form class="kw-search" id="kw-form" role="search">
<input type="search" id="kw-q" placeholder="예: PATH, #설치, 인증" aria-label="키워드 검색" autocomplete="off">
<button type="submit" class="btn">찾기</button>
</form>
<div class="kw-sug" id="kw-sug" aria-label="자동 완성"></div>
<div id="kw-result" aria-live="polite"></div>
</section>
<section id="kw-recent">
<div class="kw-sec-h"><h2>최근 찾아본 키워드</h2><button type="button" class="btn" id="kw-clear">기록 지우기</button></div>
<div class="kw-chips" id="kw-recent-list"></div>
</section>
<section id="kw-hot">
<h2>추천 키워드</h2>
<p>여러 항목에 붙은 키워드 순으로 보여 준다. 처음 둘러볼 때 시작점으로 쓴다.</p>
<div class="kw-chips" id="kw-hot-list"></div>
</section>
<section id="kw-all">
<div class="kw-sec-h"><h2>키워드 전체보기</h2>
<div class="kw-tabs" id="kw-mode" aria-label="정렬 방식">
<button type="button" class="kw-tab" data-mode="page" aria-pressed="true">페이지별</button>
<button type="button" class="kw-tab" data-mode="alpha" aria-pressed="false">가나다순</button>
</div></div>
<div class="kw-tabs" id="kw-pages" aria-label="페이지 필터"></div>
<div id="kw-all-list"></div>
</section>
